
<div class="bg-white p-6   w-full  flex justify-center ">
  <form>
    <div class="space-y-12">
      

      <div class="border-b border-gray-900/10 pb-12">
        <h2 class="text-3xl font-bold  text-gray-900">
          Personal Information
        </h2>
        

        <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
          <div class="sm:col-span-2">
            
            <label
              for="first-name"
              class="block text-sm/6 font-medium text-gray-900"
              >First name
            </label>
            <div class="mt-2">
              <input
                type="text"
                name="first-name"
                id="first-name"
                autocomplete="given-name"
                [(ngModel)]="UserForm.FirstName"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>
          <!-- {{UserForm.FirstName}}
          {{UserForm.MiddleName}}
          {{UserForm.LastName}}
          {{UserForm.Email}}
          {{UserForm.DateOfBirth}}
          {{UserForm.Country}}
          {{UserForm.City}}
          {{UserForm.State}}
          {{UserForm.ZipCode}}
          {{UserForm.StreetAddress}} -->



          <div class="sm:col-span-2">
            
            <label
              for="middle-name"
              class="block text-sm/6 font-medium text-gray-900"
              >Middle name
            </label>
            <div class="mt-2">
              <input
                type="text"
                name="middle-name"
                id="middle-name"
                autocomplete="given-name"
                [(ngModel)]="UserForm.MiddleName"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>
          
          

          <div class="sm:col-span-2">
            <label
              for="last-name"
              class="block text-sm/6 font-medium text-gray-900"
              >Last name</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="last-name"
                id="last-name"
                autocomplete="family-name"
                [(ngModel)]="UserForm.LastName"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <div class="sm:col-span-3">
            <label for="email" class="block text-sm/6 font-medium text-gray-900"
              >Email address</label
            >
            <div class="mt-2">
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                [(ngModel)]="UserForm.Email"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <div class="sm:col-span-3">
            <label for="date-of-birth" class="block text-sm/6 font-medium text-gray-900"
              >Date Of Birth</label
            >
            <div class="mt-2">
              <input
                id="date-of-birth"
                name="date-of-birth"
                type="date"
                autocomplete="date-of-birth"
                [(ngModel)]="UserForm.DateOfBirth"

                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>


          <div class="sm:col-span-2 sm:col-start-1">
            <label
              for="country"
              class="block text-sm/6 font-medium text-gray-900"
              >Country</label
            >
            <div class="mt-2">
              <input
                id="country"
                name="country"
                type="text"
                [(ngModel)]="UserForm.Country"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <!-- <div class="sm:col-span-3">
                <label for="country" class="block text-sm/6 font-medium text-gray-900">Country</label>
                <div class="mt-2 grid grid-cols-1">
                <select id="country" name="country" autocomplete="country-name" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    <option>United States</option>
                    <option>Canada</option>
                    <option>Mexico</option>
                </select>
                <svg class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
                    <path fill-rule="evenodd" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                </svg>
                </div>
            </div> -->

          <div class="sm:col-span-2">
            <label for="city" class="block text-sm/6 font-medium text-gray-900"
              >City</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="city"
                id="city"
                autocomplete="address-level2"
                [(ngModel)]="UserForm.City"

                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <div class="sm:col-span-2 sm:col-start-1">
            <label
              for="region"
              class="block text-sm/6 font-medium text-gray-900"
              >State</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="region"
                id="region"
                autocomplete="address-level1"
                [(ngModel)]="UserForm.State"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <div class="sm:col-span-2">
            <label
              for="postal-code"
              class="block text-sm/6 font-medium text-gray-900"
              >ZIP code</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="postal-code"
                id="postal-code"
                autocomplete="postal-code"
                [(ngModel)]="UserForm.ZipCode"

                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>
          <div class="col-span-full">
            <label
              for="street-address"
              class="block text-sm/6 font-medium text-gray-900"
              >Street address</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="street-address"
                id="street-address"
                autocomplete="street-address"
                [(ngModel)]="UserForm.StreetAddress"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>

            <!-- Upload Photo -->
            <div class="border-b border-gray-900/10 pb-12">
                <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                  <div class="col-span-2">
                    <label
                      for="cover-photo"
                      class="block text-sm/6 font-medium text-gray-900"
                      >Cover photo</label
                    >
                    <div
                      class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10"
                    >
                      <div class="text-center">
                        <svg
                          class="mx-auto size-12 text-gray-300"
                          viewBox="0 0 24 24"
                          fill="currentColor"
                          aria-hidden="true"
                          data-slot="icon"
                        >
                          <path
                            fill-rule="evenodd"
                            d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z"
                            clip-rule="evenodd"
                          />
                        </svg>
                        <div class="mt-4 flex text-sm/6 text-gray-600">
                          <label
                            for="file-upload"
                            class="relative cursor-pointer rounded-md bg-white font-semibold text-indigo-600 focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 focus-within:outline-hidden hover:text-indigo-500"
                          >
                            <span>Upload a file</span>
                            <input
                              id="file-upload"
                              name="file-upload"
                              type="file"
                              class="sr-only"
                              (change)="onImageSelected($event)"
                            accept="image/*"
                            />
                          </label>
                          <p class="pl-1">or drag and drop</p>
                        </div>
                        <p class="text-xs/5 text-gray-600">PNG, JPG up to 2MB</p>
                      </div>
                    </div>
                  </div>
                  <div *ngIf="imagePreview" class="col-span-2">
                    <h3 class="text-lg font-medium mb-2">Preview</h3>
                    <img [src]="imagePreview" alt="Preview" class="w-64 h-auto rounded shadow mx-auto" />
                  </div>
                </div>
                
              </div>
              <!-- Upload Photo -->
              
          </div>
        </div>
      </div>

      <div class="border-b border-gray-900/10 pb-12">
        <h2 class="text-base/7 font-bold text-gray-900">
          Occupation
        </h2>
        

        <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
          <div class="sm:col-span-3">
            <label
              for="Field"
              class="block text-sm/6 font-medium text-gray-900"
              >Field</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="Field"
                id="Field"
                autocomplete="given-name"
                [(ngModel)]="UserForm.Field"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <div class="sm:col-span-3">
            <label
              for="company-name"
              class="block text-sm/6 font-medium text-gray-900"
              >Company Name</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="company-name"
                id="company-name"
                autocomplete="company-name"
                [(ngModel)]="UserForm.CompanyName"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>


          


          <div class="sm:col-span-3">
            <label for="email" class="block text-sm/6 font-medium text-gray-900">Income</label>
            <div class="mt-2">
              <input
                id="income"
                name="income"
                type="number"
                autocomplete="cc-number"
                [(ngModel)]="UserForm.Income"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

          <div class="sm:col-span-2 ">
            <label
              for="designation"
              class="block text-sm/6 font-medium text-gray-900"
              >Designation</label
            >
            <div class="mt-2">
              <input
                id="designation"
                name="designation"
                type="text"
                [(ngModel)]="UserForm.Designation"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>
          
          <div class="sm:col-span-2 sm:col-start-1">
            <label
              for="company-address"
              class="block text-sm/6 font-medium text-gray-900"
              >Company Address</label
            >
            <div class="mt-2">
              <input
                id="company-address"
                name="company-address"
                type="text"
                [(ngModel)]="UserForm.CompanyAddress"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              />
            </div>
          </div>

        </div>
      </div>


    </div>

    <div class="mt-6 flex items-center justify-end gap-x-6">
      
      <button
        type="submit"
        class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
        (click)="SubmitData()"      
        >
        Save
      </button>
    </div>
  </form>
</div>
<div class="flex justify-center  p-4"> 

  <ul  role="list" class="divide-y divide-gray-100 w-3/4">
    <li *ngFor="let item of UserArr" class="flex justify-between gap-x-6 py-5">
      <div class="flex min-w-0 gap-x-4">
        <img class="size-12 flex-none rounded-full bg-gray-50" [src]="item.Image" alt="">
        <div class="min-w-0 flex-auto">
          <p class="text-sm/6 font-semibold text-gray-900">{{item.FirstName}} {{item.MiddleName}} {{item.LastName}}</p>
          <p class="mt-1 truncate text-xs/5 text-gray-500">{{item.Email}}</p>
        </div>
      </div>
      <div class="hidden shrink-0 sm:flex sm:flex-col sm:items-end">
        <p class="text-sm/6 text-gray-900">{{item.Designation}}</p>
        <p class="mt-1 text-xs/5 text-gray-500">{{item.DateOfBirth}} </p>
      </div>
    </li>
  </ul>
</div>
